<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>আয় ব্যয়</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1a6dff"><link rel="icon" href="icon-192.png"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#fafafa;--card:#fff;--tx:#1b1b1f;--mut:#8a8f9c;--pri:#1a6dff;--onp:#fff;--inc:#2e9e4f;--exp:#e53935;--bd:#e3e6ee;--ib:#e9f6ec;--eb:#fcefee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#121316;--card:#1d1f24;--tx:#eceef3;--mut:#9aa0ad;--bd:#2d3037;--ib:#1b2e22;--eb:#34201f}
:root[data-theme=vip]{--bg:#0a0a0a;--card:#16130b;--tx:#f6e7b4;--mut:#a89558;--pri:#d4af37;--onp:#111;--inc:#7ddc8f;--exp:#ff7a6e;--bd:#3b3217;--ib:#16241a;--eb:#2a1816}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;max-width:560px;margin:auto;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
h1{margin:0;font-size:24px;color:var(--pri)}
.ic{background:none;border:0;font-size:22px;color:var(--tx);cursor:pointer;margin-left:10px}
nav{display:flex;justify-content:space-around;border-bottom:1px solid var(--bd);padding:6px 0}
nav button{width:44px;height:44px;border-radius:12px;border:2px solid var(--bd);background:none;color:var(--mut);font-size:18px;cursor:pointer}

main{flex:1;overflow-y:auto;padding:14px 14px 90px}

.seg button.on{background:var(--pri);color:var(--onp)}
.sum{display:flex;justify-content:space-around;text-align:center;font-size:14px}.sum b{display:block;font-size:20px;margin-top:4px}
.i{color:var(--inc)}.e{color:var(--exp)}.b{color:var(--pri)}.m{color:var(--mut);font-size:13px}
.day{color:var(--mut);font-size:13px;margin:14px 2px 6px}
.row{display:flex;justify-content:space-between;align-items:center;border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row.i{background:var(--ib)}.row.e{background:var(--eb)}.row span{color:var(--tx)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar div{height:100%;background:var(--pri)}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:max(20px,calc(50% - 260px));width:58px;height:58px;border-radius:50%;border:0;background:var(--pri);color:var(--onp);font-size:30px;box-shadow:0 4px 14px #0004;cursor:pointer}
.x{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer}
.empty{text-align:center;color:var(--mut);margin-top:60px}
#mo{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center}
#mo form,#mo .f{background:var(--card);width:100%;max-width:560px;padding:18px;border-radius:22px 22px 0 0}
#mo input,#mo select{width:100%;padding:12px;margin:6px 0 10px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
#mo .go{width:100%;padding:13px;border:0;border-radius:12px;background:var(--pri);color:var(--onp);font:inherit;font-weight:700;cursor:pointer}
.chip{white-space:nowrap;padding:8px 12px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}td{padding:6px 4px}.mi{display:flex;justify-content:space-between;align-items:center;padding:14px 6px;border-bottom:1px solid var(--bd);font-size:17px;cursor:pointer}.si{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:6px}.cir{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;font-weight:700}.cir.i{background:#2e9e4f33}.cir.e{background:#e5393533}#off{position:fixed;left:0;right:0;bottom:0;background:#f44336;color:#fff;padding:12px 16px;display:none;z-index:5;max-width:560px;margin:auto}body.o .fab{bottom:calc(76px + env(safe-area-inset-bottom,0px))}.ttl{display:inline-block;font-size:26px;font-weight:700;border-bottom:2px solid var(--pri);padding-bottom:4px}.tg{padding:10px 18px;border-radius:12px;border:2px solid transparent;background:var(--bd);color:var(--mut);font:inherit;cursor:pointer}.tg.on{border-color:var(--pri);color:var(--pri);font-weight:700}</style></head><body>
<header><h1>আয় ব্যয়</h1><div><button class="ic" id="bl">🔔</button><button class="ic" id="th" title="থিম">🌙</button><button class="ic" id="st">⚙️</button></div></header>

<script>

let S={tx:[],du:[],sv:[],bu:0,cb:{},cc:[],tk:[],qk:[],rp:[],th:'light'};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('aybay')||'{}'))}catch(e){}

const idbGet=async()=>{try{const d=await idb();return await new Promise(r=>{const q=d.transaction('k').objectStore('k').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){}};
const FB={apiKey:"AIzaSyDoa0o207iGfnCI2-xzxglSDxOlAamqs4M",authDomain:"aybay-676c9.firebaseapp.com",projectId:"aybay-676c9",appId:"1:917948003695:web:04c78dd29a21c2742ea49a"}; // Firebase কনফিগ এখানে বসান
let fdb,fu;
function fbInit(){if(!FB.apiKey||!window.firebase)return;firebase.initializeApp(FB);firebase.auth().onAuthStateChanged(u=>{fu=u;if(!u)return;fdb=firebase.firestore();fdb.doc('users/'+u.uid).get().then(d=>{if(d.exists){const o=JSON.parse(d.data().j);if((o.ts||0)>(S.ts||0)||!(S.tx.length||S.du.length||S.sv.length||S.tk.length)){S=Object.assign(S,o);syncC();theme();draw()}else save()}else save()}).catch(()=>{})})}
const save=()=>{S.ts=Date.now();const j=JSON.stringify(S);if(fdb&&fu)fdb.doc('users/'+fu.uid).set({j}).catch(()=>{});try{localStorage.setItem('aybay',j)}catch(e){}idbSet(j)};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

let tab=0,rng=1,q='',yr=new Date().getFullYear(),qe=0;const BASE=['খাবার','যাতায়াত','বিল','বাজার','চিকিৎসা','শিক্ষা','পরিবার','বেতন','ব্যবসা'],C=[];
const segH=()=>`<div class="seg">${['আজ',MNS[new Date().getMonth()],'মোট'].map((n,i)=>`<button class="${i==rng?'on':''}" onclick="rng=${i};draw()">${n}</button>`).join('')}</div>`;
const tabs=['⇄','⇅','📈','➕','☑','👤'];

const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const mon=()=>today().slice(0,7);
const DN=d=>{const[y,m,x]=d.split('-');return bn(+x)+' '+['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'][m-1]+', '+bn(y)};
const addTx=(t,c,d,a,date)=>S.tx.push({id:Date.now()+Math.random(),t,c,d,a,date:date||today(),time:new Date().toLocaleTimeString('bn-BD',{hour:'numeric',minute:'2-digit'})});
function qadd(i){const x=S.qk[i];addTx(x.t,x.c,x.d,x.a);save();draw()}
function qnew(){form('কুইক এন্ট্রি তৈরি',[{o:['ব্যয়','আয়']},{o:C},{l:'বিবরণ'},{l:'টাকা',n:1}],v=>S.qk.push({t:v[0]=='আয়'?'i':'e',c:v[1],d:v[2],a:+v[3]}))}
function repRun(){const cm=today().slice(0,7);let ch=0;S.rp.forEach(r=>{let[y,m]=r.last.split('-').map(Number);for(;;){m++;if(m>12){m=1;y++}const k=y+'-'+pad(m);if(k>cm)break;const date=k+'-'+pad(Math.min(r.day,new Date(y,m,0).getDate()));if(date>today())break;addTx(r.t,r.c,r.d+' 🔁',r.a,date);r.last=k;ch=1}});if(ch)save()}
function openRep(){$('#fm').innerHTML='<b>🔁 রিপিট লেনদেন (প্রতি মাসে অটো)</b>'+(S.rp.map((r,i)=>`<div class="row" style="background:var(--bg)"><span>${r.d} · ${fmt(r.a)} · প্রতি মাসের ${bn(r.day)} তারিখ</span><button class="x" onclick="S.rp.splice(${i},1);save();openRep()">✕</button></div>`).join('')||'<p class="m">কোনো রিপিট নেই</p>')+'<button class="go" id="nr">＋ নতুন রিপিট</button>';$('#mo').style.display='flex';
$('#nr').onclick=()=>form('নতুন রিপিট',[{o:['ব্যয়','আয়']},{o:C},{l:'বিবরণ'},{l:'টাকা',n:1},{l:'মাসের কত তারিখ (১-২৮)',n:1}],v=>{const day=Math.min(28,Math.max(1,+v[4]||1)),n=new Date(),cm=today().slice(0,7),pm=n.getMonth()?n.getFullYear()+'-'+pad(n.getMonth()):(n.getFullYear()-1)+'-12';S.rp.push({t:v[0]=='আয়'?'i':'e',c:v[1],d:v[2],a:+v[3],day,last:day<n.getDate()?cm:pm});repRun()})}
function syncC(){C.length=0;C.push(...BASE,...(S.cc||[]),'অন্যান্য')}
function openCat(){$('#fm').innerHTML='<b>🏷️ নিজের ক্যাটাগরি</b>'+(S.cc.map((k,i)=>`<div class="row" style="background:var(--bg)"><span>${k}</span><button class="x" onclick="S.cc.splice(${i},1);save();openCat()">✕</button></div>`).join('')||'<p class="m">এখনো কোনো নিজের ক্যাটাগরি নেই</p>')+'<button class="go" id="nc">＋ নতুন ক্যাটাগরি</button>';$('#mo').style.display='flex';
$('#nc').onclick=()=>form('নতুন ক্যাটাগরি',[{l:'ক্যাটাগরির নাম'}],v=>{if(!C.includes(v[0]))S.cc.push(v[0])})}
const MNS=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'],SM=(a,t)=>a.filter(x=>x.t==t).reduce((r,x)=>r+x.a,0);
let FL={t:'',c:''};
const closeM=()=>{$('#mo').style.display='none'};
function openMenu(){const m=(l,f,ic)=>`<div class="mi" onclick="${f}">${l}<span>${ic}</span></div>`;
$('#fm').innerHTML=m('ফিল্টার করুন','openFilter()','⏷')+m('ক্যাটাগরি','openCat()','🏷️')+m('গ্রাফ দেখুন','tab=6;closeM();draw()','📊')+m('কুইক এন্ট্রি','openQ()','⚡')+m('রিপিট','openRep()','🔁')+m('সার্চবার শো করুন','S.sb=S.sb===false;save();closeM();draw()',S.sb===false?'☐':'☑️')+m('মাসিক পার্সেন্টেজ বার','S.pb=S.pb===false;save();closeM();draw()',S.pb===false?'☐':'☑️');$('#mo').style.display='flex'}
function openFilter2(){syncC();form('ফিল্টার',[{o:['সব ধরন','আয়','ব্যয়']},{o:['সব ক্যাটাগরি',...C]}],v=>{FL={t:v[0]=='আয়'?'i':v[0]=='ব্যয়'?'e':'',c:v[1]=='সব ক্যাটাগরি'?'':v[1]}})}
function openQ(){$('#fm').innerHTML='<b>⚡ কুইক এন্ট্রি</b>'+(S.qk.map((x,i)=>`<div class="mi"><span onclick="qadd(${i});closeM()" style="flex:1">${x.d} · ${fmt(x.a)}</span><button class="x" onclick="S.qk.splice(${i},1);save();openQ()">✕</button></div>`).join('')||'<p class="m">কুইক এন্ট্রি নেই</p>')+'<button class="go" onclick="qnew()">＋ নতুন কুইক</button>';$('#mo').style.display='flex'}
function rowMenu(id){$('#fm').innerHTML=`<div class="mi" onclick="txEdit(${id})">সম্পাদনা<span>✏️</span></div><div class="mi" onclick="S.tx=S.tx.filter(y=>y.id!=${id});save();closeM();draw()">মুছুন<span>🗑️</span></div>`;$('#mo').style.display='flex'}
function txEdit(id){const x=S.tx.find(y=>y.id==id);if(!x)return;form('সম্পাদনা',[{o:['ব্যয়','আয়']},{o:C},{l:'বিবরণ'},{l:'টাকা',n:1},{l:'তারিখ',d:1}],v=>{x.t=v[0]=='আয়'?'i':'e';x.c=v[1];x.d=v[2];x.a=+v[3];x.date=v[4]||x.date},[x.t=='i'?'আয়':'ব্যয়',x.c||'অন্যান্য',x.d,x.a,x.date])}
$('#bl').onclick=()=>{$('#fm').innerHTML='<b>🔔 নোটিফিকেশন</b><p class="m">নতুন কোনো নোটিফিকেশন নেই</p>';$('#mo').style.display='flex'};
const ob=()=>{const o=!navigator.onLine;$('#off').style.display=o?'block':'none';document.body.classList.toggle('o',o)};addEventListener('online',ob);addEventListener('offline',ob);ob();
let dq='',df=0,sw=0,tw=0,DG=[];
function grp(){const m={};S.du.forEach((x,i)=>{const o=m[x.n]||(m[x.n]={n:x.n,p:'',net:0,ix:[]});o.net+=x.t=='পাবো'?x.a:-x.a;if(x.p)o.p=x.p;o.ix.push(i)});return Object.values(m)}
function duMenu(k){const g=DG[k];if(!g)return;$('#fm').innerHTML=`<b>${g.n}</b> <span class="m">${g.p}</span>`+g.ix.map(i=>`<div class="mi"><span>${S.du[i].t} ${fmt(S.du[i].a)}</span><button class="x" onclick="S.du.splice(${i},1);save();closeM();draw()">✕</button></div>`).join('')+`<div class="mi" onclick="duAdd(${k})">নতুন হিসাব যোগ<span>＋</span></div><div class="mi" onclick="S.du=S.du.filter(x=>x.n!=DG[${k}].n);save();closeM();draw()">ব্যক্তিকে মুছুন<span>🗑️</span></div>`;$('#mo').style.display='flex'}
function duAdd(k){const g=DG[k];form('হিসাব যোগ',[{o:['পাবো','দিবো']},{l:'টাকা',n:1}],v=>S.du.push({t:v[0],n:g.n,p:g.p,a:+v[1]}))}
function svMenu(i){$('#fm').innerHTML=`<div class="mi" onclick="svAdd(${i})">জমা যোগ করুন<span>＋</span></div><div class="mi" onclick="S.sv.splice(${i},1);save();closeM();draw()">মুছুন<span>🗑️</span></div>`;$('#mo').style.display='flex'}
function svAdd(i){form('জমা যোগ',[{l:'টাকা',n:1}],v=>S.sv[i].c+=+v[0])}
const tgH=(t,n,v,k)=>`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span class="ttl">${t} (${bn(n)})</span><span><button class="tg ${v?'':'on'}" onclick="${k}=0;draw()">চলমান</button> <button class="tg ${v?'on':''}" onclick="${k}=1;draw()">সম্পন্ন</button></span></div>`;
let DF=null;
const dfL=()=>{const d=DF;return d.k=='date'?DN(d.a):d.k=='month'?MNS[+d.a.slice(5,7)-1]+' '+bn(d.a.slice(0,4)):d.k=='year'?bn(d.a.slice(0,4)):DN(d.a)+' – '+DN(d.b)};
function openFilter(){$('#fm').innerHTML='<b style="display:block;text-align:center;font-size:20px;margin-bottom:12px">নির্বাচন করুন</b>'+[['তারিখ অনুযায়ী','date'],['মাস অনুযায়ী','month'],['বছর অনুযায়ী','year'],['কাস্টম রেঞ্জ','range']].map(([l,k])=>`<button class="tg" style="width:100%;margin-bottom:10px;padding:16px" onclick="dfPick('${k}')">${l}</button>`).join('')+'<button class="tg" style="width:100%;padding:16px" onclick="openFilter2()">ধরন/ক্যাটাগরি অনুযায়ী</button>';$('#mo').style.display='flex'}
function dfPick(k){
 if(k=='date')form('তারিখ বাছুন',[{l:'তারিখ',d:1}],v=>{DF={k,a:v[0],b:v[0]}});
 else if(k=='month')form('মাস বাছুন',[{l:'মাস',m:1}],v=>{DF={k,a:v[0]+'-01',b:v[0]+'-31'}});
 else if(k=='year')form('বছর বাছুন',[{l:'বছর (যেমন 2026)',n:1}],v=>{DF={k,a:v[0]+'-01-01',b:v[0]+'-12-31'}});
 else form('কাস্টম রেঞ্জ',[{l:'শুরুর তারিখ',d:1},{l:'শেষ তারিখ',d:1}],v=>{const lo=v[0]<v[1];DF={k,a:lo?v[0]:v[1],b:lo?v[1]:v[0]}})}
function theme(){document.documentElement.dataset.theme=S.th;$('#th').textContent={light:'🌙',dark:'👑',vip:'☀️'}[S.th]}
$('#th').onclick=()=>{S.th={light:'dark',dark:'vip',vip:'light'}[S.th];theme();save()};
function form(title,fields,cb,defs){
  syncC();
  $('#fm').innerHTML='<b>'+title+'</b><br>'+fields.map((f,i)=>f.o?`<select id="f${i}">${f.o.map(o=>`<option>${o}</option>`).join('')}</select>`:(f.d||f.m)?`<div class="m">${f.l}</div><input id="f${i}" type="${f.m?'month':'date'}" value="${f.m?today().slice(0,7):today()}">`:`<input id="f${i}" placeholder="${f.l}" ${f.n?'type="number" inputmode="decimal"':''}>`).join('')+'<button class="go" id="ok">সংরক্ষণ</button>';
  $('#mo').style.display='flex';if(defs)defs.forEach((v,i)=>$('#f'+i).value=v);
